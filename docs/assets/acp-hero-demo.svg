<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" role="img" aria-label="Sealbridge Zero-Trust E2EE Agent Collaboration Architecture and Live Flow">
  <!-- All comments in English: Animated Hero Diagram for Sealbridge -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="ownerAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#0b192c" />
    </linearGradient>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="ownerBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06392f" />
      <stop offset="100%" stop-color="#091e1a" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

      /* Animated E2EE request packet (Owner A -> Blind Relay -> Owner B) */
      @keyframes moveReq {
        0%, 8% { transform: translate(355px, 185px); opacity: 0; }
        12% { transform: translate(355px, 185px); opacity: 1; }
        38% { transform: translate(815px, 185px); opacity: 1; }
        44%, 100% { transform: translate(815px, 185px); opacity: 0; }
      }

      /* Animated E2EE progress packet (Owner B -> Blind Relay -> Owner A) */
      @keyframes moveProg {
        0%, 40% { transform: translate(815px, 240px); opacity: 0; }
        45% { transform: translate(815px, 240px); opacity: 1; }
        65% { transform: translate(355px, 240px); opacity: 1; }
        70%, 100% { transform: translate(355px, 240px); opacity: 0; }
      }

      /* Animated E2EE deliverable + receipt packet (Owner B -> Blind Relay -> Owner A) */
      @keyframes moveRes {
        0%, 66% { transform: translate(815px, 295px); opacity: 0; }
        71% { transform: translate(815px, 295px); opacity: 1; }
        92% { transform: translate(355px, 295px); opacity: 1; }
        97%, 100% { transform: translate(355px, 295px); opacity: 0; }
      }

      /* Pulse highlight for Blind Relay lock icon */
      @keyframes pulseRelay {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }

      /* Terminal step highlights */
      @keyframes step1 {
        0%, 5% { opacity: 0.35; }
        10%, 95% { opacity: 1; }
        100% { opacity: 0.35; }
      }
      @keyframes step2 {
        0%, 40% { opacity: 0.35; }
        45%, 95% { opacity: 1; }
        100% { opacity: 0.35; }
      }
      @keyframes step3 {
        0%, 68% { opacity: 0.35; }
        74%, 95% { opacity: 1; }
        100% { opacity: 0.35; }
      }

      .pkt-req { animation: moveReq 10s infinite ease-in-out; }
      .pkt-prog { animation: moveProg 10s infinite ease-in-out; }
      .pkt-res { animation: moveRes 10s infinite ease-in-out; }
      .relay-pulse { animation: pulseRelay 3s infinite ease-in-out; }
      .term-s1 { animation: step1 10s infinite; }
      .term-s2 { animation: step2 10s infinite; }
      .term-s3 { animation: step3 10s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Top Header Bar -->
  <rect x="24" y="18" width="1152" height="54" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="48" cy="45" r="7" fill="#38bdf8" />
  <text x="66" y="42" class="font-sans" font-size="16" font-weight="700" fill="#f8fafc">Sealbridge — Cross-Owner Zero-Trust E2EE Runtime &amp; MCP Server</text>
  <text x="66" y="61" class="font-mono" font-size="12" fill="#94a3b8">No shared API keys  •  Ed25519 DID + RFC 8785 JCS  •  X25519 + AES-256-GCM Blind Relay  •  Isolated Sandbox + Bilateral Audit</text>
  <rect x="1018" y="30" width="142" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="1089" y="49" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#34d399">375 TESTS PASS</text>

  <!-- LEFT ZONE: Owner A (Requester) -->
  <rect x="24" y="88" width="330" height="300" rx="12" fill="url(#ownerAGrad)" stroke="#0284c7" stroke-width="2" />
  <rect x="40" y="102" width="138" height="24" rx="5" fill="#0369a1" />
  <text x="109" y="118" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#e0f2fe">TRUST ZONE A</text>
  <text x="188" y="118" class="font-mono" font-size="11" fill="#7dd3fc">did:key:z6Mk...Alice</text>

  <text x="40" y="148" class="font-sans" font-size="17" font-weight="700" fill="#f0f9ff">Owner A's Agent (Requester)</text>
  <text x="40" y="168" class="font-sans" font-size="12" fill="#bae6fd">Claude Code / Cursor / Codex / Grok Bot</text>

  <!-- Sub-boxes in Zone A -->
  <rect x="40" y="182" width="298" height="54" rx="8" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
  <text x="54" y="202" class="font-mono" font-size="12" font-weight="700" fill="#38bdf8">MCP Server (acp mcp-server)</text>
  <text x="54" y="222" class="font-mono" font-size="11" fill="#e0f2fe">acp_delegate_task | acp_delegate_multi</text>

  <rect x="40" y="246" width="298" height="64" rx="8" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
  <text x="54" y="266" class="font-mono" font-size="12" font-weight="700" fill="#38bdf8">CapabilityGuard &amp; 3-Stage Verifier</text>
  <text x="54" y="284" class="font-mono" font-size="11" fill="#bae6fd">• Attenuated CapabilityToken (UCAN-style)</text>
  <text x="54" y="300" class="font-mono" font-size="11" fill="#bae6fd">• Signature + Budget + Schema + HITL Gate</text>

  <rect x="40" y="320" width="298" height="52" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
  <text x="54" y="340" class="font-mono" font-size="12" font-weight="700" fill="#7dd3fc">Local Append-Only Audit Log A</text>
  <text x="54" y="358" class="font-mono" font-size="11" fill="#e0f2fe">Hash-chained JCS + Ed25519 receipts</text>

  <!-- CENTER ZONE: Untrusted Zero-Knowledge Blind Relay -->
  <rect x="446" y="88" width="308" height="300" rx="12" fill="url(#relayGrad)" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="462" y="102" width="166" height="24" rx="5" fill="#3730a3" />
  <text x="545" y="118" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#e0e7ff">UNTRUSTED TRANSPORT</text>
  <text x="638" y="118" class="font-mono" font-size="11" fill="#a5b4fc">Zero-Knowledge</text>

  <text x="600" y="148" text-anchor="middle" class="font-sans" font-size="17" font-weight="700" fill="#eef2ff">Blind Relay (Cloudflare / Local)</text>
  <text x="600" y="168" text-anchor="middle" class="font-mono" font-size="11" fill="#818cf8">acp-relay.agent-collab.workers.dev</text>

  <!-- Relay internal box -->
  <rect x="464" y="182" width="272" height="128" rx="8" fill="#0f172a" stroke="#4f46e5" stroke-width="1.2" class="relay-pulse" />
  <text x="600" y="206" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#c7d2fe">E2EE Ciphertext Only</text>
  <text x="600" y="226" text-anchor="middle" class="font-mono" font-size="11" fill="#94a3b8">ephemeral X25519 + HKDF-SHA256</text>
  <text x="600" y="244" text-anchor="middle" class="font-mono" font-size="11" fill="#94a3b8">AES-256-GCM (AAD bound to header)</text>
  <rect x="480" y="256" width="240" height="40" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
  <text x="600" y="273" text-anchor="middle" class="font-mono" font-size="10" fill="#f87171">CANNOT READ: Prompts / Tokens / Output</text>
  <text x="600" y="289" text-anchor="middle" class="font-mono" font-size="10" fill="#34d399">VERIFIES: RelayAuth + Outer Ed25519 Sig</text>

  <rect x="464" y="320" width="272" height="52" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="600" y="340" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#a5b4fc">Hardened Guards (M3.1)</text>
  <text x="600" y="358" text-anchor="middle" class="font-mono" font-size="10" fill="#cbd5e1">1 MiB cap • Replay FIFO • SSRF block</text>

  <!-- RIGHT ZONE: Owner B (Sandboxed Worker) -->
  <rect x="846" y="88" width="330" height="300" rx="12" fill="url(#ownerBGrad)" stroke="#10b981" stroke-width="2" />
  <rect x="862" y="102" width="138" height="24" rx="5" fill="#047857" />
  <text x="931" y="118" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#d1fae5">TRUST ZONE B</text>
  <text x="1010" y="118" class="font-mono" font-size="11" fill="#6ee7b7">did:key:z6Mk...Bob</text>

  <text x="862" y="148" class="font-sans" font-size="17" font-weight="700" fill="#ecfdf5">Owner B's Agent (Worker)</text>
  <text x="862" y="168" class="font-sans" font-size="12" fill="#a7f3d0">Sandboxed Runner / BYOK Adapter</text>

  <rect x="862" y="182" width="298" height="54" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="876" y="202" class="font-mono" font-size="12" font-weight="700" fill="#34d399">Contract &amp; Revocation Check</text>
  <text x="876" y="222" class="font-mono" font-size="11" fill="#d1fae5">Verifies TaskContract + RevocationRegistry</text>

  <rect x="862" y="246" width="298" height="64" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="876" y="266" class="font-mono" font-size="12" font-weight="700" fill="#34d399">Isolated Sandbox Execution</text>
  <text x="876" y="284" class="font-mono" font-size="11" fill="#a7f3d0">• Hardened OCI / Restricted Subprocess</text>
  <text x="876" y="300" class="font-mono" font-size="11" fill="#a7f3d0">• Loopback Credential Broker (0 key leaks)</text>

  <rect x="862" y="320" width="298" height="52" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1" />
  <text x="876" y="340" class="font-mono" font-size="12" font-weight="700" fill="#6ee7b7">Signed Attestation &amp; Audit Log B</text>
  <text x="876" y="358" class="font-mono" font-size="11" fill="#ecfdf5">Signs Deliverable + UsageReceipt + Audit</text>

  <!-- Wire Connection Lines Between Zones -->
  <!-- Line 1: PROPOSE + E2EE TaskContract -->
  <line x1="354" y1="195" x2="446" y2="195" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="5,3" />
  <line x1="754" y1="195" x2="846" y2="195" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="5,3" />
  <polygon points="444,190 454,195 444,200" fill="#0ea5e9" />
  <polygon points="844,190 854,195 844,200" fill="#0ea5e9" />

  <!-- Line 2: Encrypted PROGRESS Stream -->
  <line x1="354" y1="250" x2="446" y2="250" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="754" y1="250" x2="846" y2="250" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="356,245 346,250 356,255" fill="#f59e0b" />
  <polygon points="756,245 746,250 756,255" fill="#f59e0b" />

  <!-- Line 3: Signed DELIVER + Receipt -->
  <line x1="354" y1="305" x2="446" y2="305" stroke="#10b981" stroke-width="2.5" />
  <line x1="754" y1="305" x2="846" y2="305" stroke="#10b981" stroke-width="2.5" />
  <polygon points="356,300 346,305 356,310" fill="#10b981" />
  <polygon points="756,300 746,305 756,310" fill="#10b981" />

  <!-- Animated Packets Moving Across the Wires -->
  <g class="pkt-req" filter="url(#glowCyan)">
    <rect x="-55" y="-14" width="110" height="24" rx="12" fill="#0284c7" stroke="#bae6fd" stroke-width="1.5" />
    <text x="0" y="2" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#ffffff">1. E2EE PROPOSE</text>
  </g>

  <g class="pkt-prog">
    <rect x="-58" y="-14" width="116" height="24" rx="12" fill="#b45309" stroke="#fde68a" stroke-width="1.5" />
    <text x="0" y="2" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#ffffff">2. PROGRESS 50%</text>
  </g>

  <g class="pkt-res" filter="url(#glowGreen)">
    <rect x="-62" y="-14" width="124" height="24" rx="12" fill="#059669" stroke="#a7f3d0" stroke-width="1.5" />
    <text x="0" y="2" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#ffffff">3. SIGNED DELIVER</text>
  </g>

  <!-- Bottom Live Terminal Strip -->
  <rect x="24" y="406" width="1152" height="174" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" />
  <circle cx="46" cy="426" r="5.5" fill="#ef4444" />
  <circle cx="64" cy="426" r="5.5" fill="#f59e0b" />
  <circle cx="82" cy="426" r="5.5" fill="#10b981" />
  <text x="102" y="430" class="font-mono" font-size="12" font-weight="700" fill="#94a3b8">LIVE SESSION TRACE — E2EE Delegation + Real-Time Progress + Red-Team Tamper Defense</text>
  <line x1="24" y1="442" x2="1176" y2="442" stroke="#1e293b" stroke-width="1" />

  <!-- Step 1 in Terminal -->
  <g class="term-s1">
    <rect x="40" y="454" width="1120" height="32" rx="6" fill="#0c192c" stroke="#0369a1" stroke-width="1" />
    <text x="54" y="475" class="font-mono" font-size="12" fill="#38bdf8">[1] MCP Call:</text>
    <text x="155" y="475" class="font-mono" font-size="12" fill="#e2e8f0">acp_delegate_task(to="did:key:z6Mk...Bob", cipher="X25519+AES-256-GCM", budget=5000)</text>
    <text x="905" y="475" class="font-mono" font-size="12" font-weight="700" fill="#7dd3fc">→ Relay sees ciphertext only</text>
  </g>

  <!-- Step 2 in Terminal -->
  <g class="term-s2">
    <rect x="40" y="494" width="1120" height="32" rx="6" fill="#1c1917" stroke="#b45309" stroke-width="1" />
    <text x="54" y="515" class="font-mono" font-size="12" fill="#fbbf24">[2] Stream:</text>
    <text x="155" y="515" class="font-mono" font-size="12" fill="#e2e8f0">PROGRESS 50% (step="sandbox_exec", isolation="subprocess_restricted", tokens=412)</text>
    <text x="905" y="515" class="font-mono" font-size="12" font-weight="700" fill="#fcd34d">→ Countersigned &amp; Quota-metered</text>
  </g>

  <!-- Step 3 in Terminal -->
  <g class="term-s3">
    <rect x="40" y="534" width="735" height="32" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1" />
    <text x="54" y="555" class="font-mono" font-size="12" font-weight="700" fill="#34d399">[3] Verified:</text>
    <text x="155" y="555" class="font-mono" font-size="12" fill="#dcfce7">DELIVER + Ed25519 Receipt + Schema Check → STATE: SETTLED | AUDIT: VALID</text>

    <rect x="787" y="534" width="373" height="32" rx="6" fill="#3b0712" stroke="#f43f5e" stroke-width="1" />
    <text x="801" y="555" class="font-mono" font-size="11.5" font-weight="700" fill="#fda4af">Tampered / Revoked / SSRF → BLOCKED (11/11)</text>
  </g>
</svg>
